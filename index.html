<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Paper Issue Register — Calicut University FYUGP</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --accent: #1e3a8a;
      --accent-soft: #eff6ff;
      --print-line: #000000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.4;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button, .btn-label {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button:hover, .btn-label:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.primary:hover {
      background: #172554;
    }

    button.danger {
      color: #b91c1c;
      border-color: #fecaca;
      background: #fef2f2;
    }

    button.danger:hover {
      background: #fee2e2;
    }

    .container {
      max-width: 1050px;
      margin: 20px auto 48px;
      padding: 0 16px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
    }

    .kpi-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 700;
    }

    .kpi-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 2px;
    }

    .sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px 28px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }

    .doc-header {
      text-align: center;
      border-bottom: 2px solid var(--print-line);
      padding-bottom: 10px;
      margin-bottom: 14px;
      font-family: Cambria, "Times New Roman", serif;
    }

    .doc-title-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .inline-input {
      border: none;
      border-bottom: 1px dashed #64748b;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      color: inherit;
      background: transparent;
      text-align: center;
      padding: 0 4px;
      text-transform: uppercase;
    }

    .inline-input:focus {
      outline: none;
      border-bottom-style: solid;
      border-bottom-color: var(--accent);
      background: var(--accent-soft);
    }

    .doc-subtitle {
      font-size: 16px;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: 0.03em;
    }

    .doc-college-wrap {
      margin-top: 5px;
      display: flex;
      justify-content: center;
    }

    .college-input {
      width: 100%;
      max-width: 680px;
      border: none;
      border-bottom: 1px dashed #64748b;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      background: transparent;
      text-align: center;
      text-transform: uppercase;
      padding: 2px 8px;
    }

    .college-input:focus {
      outline: none;
      border-bottom-style: solid;
      border-bottom-color: var(--accent);
      background: var(--accent-soft);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 16px;
      font-family: Cambria, "Times New Roman", serif;
      font-size: 13px;
      font-weight: 700;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meta-row label {
      min-width: 155px;
      text-transform: uppercase;
    }

    .meta-input {
      flex: 1;
      border: none;
      border-bottom: 1px dotted #334155;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      background: transparent;
    }

    .meta-input:focus {
      outline: none;
      border-bottom-style: solid;
      border-bottom-color: var(--accent);
      background: var(--accent-soft);
    }

    .examiner-block {
      margin-bottom: 20px;
      font-family: Cambria, "Times New Roman", serif;
    }

    .examiner-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 13px;
    }

    .examiner-left {
      display: flex;
      align-items: center;
      flex: 1;
      gap: 6px;
    }

    .examiner-name-input {
      flex: 1;
      max-width: 420px;
      border: none;
      border-bottom: 1px dotted #334155;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      background: transparent;
    }

    .examiner-name-input:focus {
      outline: none;
      border-bottom-style: solid;
      border-bottom-color: var(--accent);
      background: var(--accent-soft);
    }

    .block-controls {
      display: flex;
      gap: 4px;
    }

    .mini-btn {
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 4px;
      font-family: "Segoe UI", sans-serif;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 1.5px solid var(--print-line);
    }

    th, td {
      border: 1px solid var(--print-line);
      padding: 5px 6px;
      vertical-align: top;
      font-size: 12px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    th {
      background: #f8fafc;
      font-weight: 700;
      text-align: center;
      font-size: 11px;
    }

    .col-sl { width: 6%; text-align: center; }
    .col-course { width: 28%; }
    .col-qp { width: 13%; }
    .col-date { width: 13%; }
    .col-fnan { width: 8%; text-align: center; }
    .col-reg { width: 17%; }
    .col-count { width: 8%; }
    .col-sign { width: 7%; }

    textarea.cell-input, input.cell-input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: Cambria, "Times New Roman", serif;
      font-size: 12px;
      color: var(--ink);
      resize: none;
      padding: 0;
      margin: 0;
      display: block;
      line-height: 1.35;
    }

    textarea.cell-input:focus, input.cell-input:focus {
      outline: none;
      background: var(--accent-soft);
    }

    .center-input {
      text-align: center;
    }

    .count-input {
      text-align: center;
      font-weight: 700;
    }

    .row-del-btn {
      border: none;
      background: transparent;
      color: #dc2626;
      font-size: 12px;
      padding: 0 2px;
      cursor: pointer;
    }

    .gross-row td {
      font-weight: 700;
      font-size: 13px;
      background: #f8fafc;
      padding: 6px 8px;
    }

    .gross-label {
      text-align: right;
      letter-spacing: 0.03em;
    }

    .gross-val {
      text-align: center;
      font-size: 14px;
    }

    .footer-summary {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 2px solid var(--print-line);
      font-family: Cambria, "Times New Roman", serif;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
    }

    .grand-box {
      border: 1.5px solid var(--print-line);
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 700;
      background: #f8fafc;
    }

    .sign-cols {
      display: flex;
      gap: 40px;
      font-size: 12px;
      font-weight: 700;
    }

    .sign-line {
      min-width: 180px;
      text-align: center;
      border-top: 1px solid var(--print-line);
      padding-top: 4px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .kpi-grid {
        grid-template-columns: 1fr;
      }
      .sheet {
        padding: 14px;
      }
      th, td {
        font-size: 11px;
        padding: 4px;
      }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }

      body {
        background: #ffffff;
      }

      .topbar, .kpi-grid, .block-controls, .row-del-btn, .toast, .no-print {
        display: none !important;
      }

      .container {
        max-width: 100%;
        margin: 0;
        padding: 0;
      }

      .sheet {
        border: none;
        box-shadow: none;
        padding: 0;
      }

      th {
        background: #ffffff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .gross-row td, .grand-box {
        background: #ffffff !important;
      }

      .examiner-block {
        break-inside: avoid;
      }

      textarea.cell-input, input.cell-input, .inline-input, .meta-input, .examiner-name-input {
        background: transparent !important;
        border-color: #000000 !important;
      }

      .college-input {
        background: transparent !important;
        border-bottom: none !important;
      }

      .college-input:placeholder-shown {
        border-bottom: 1px dotted #000000 !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>University Paper Issue Register</h1>
      <p>Calicut University FYUGP Examination Portal</p>
    </div>
    <div class="actions">
      <button type="button" onclick="addExaminerBlock()">+ Add Examiner</button>
      <button type="button" onclick="exportBackup()">Backup JSON</button>
      <label class="btn-label" for="restoreFile">Restore JSON</label>
      <input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="importBackup(event)" />
      <button type="button" class="danger" onclick="clearRegister()">Clear All</button>
      <button type="button" class="primary" onclick="handlePrint()">Print / Save PDF</button>
    </div>
  </header>

  <main class="container">
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Additional Examiners</div>
        <div class="kpi-value" id="kpiExaminers">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Entry Rows</div>
        <div class="kpi-value" id="kpiRows">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Grand Total Papers</div>
        <div class="kpi-value" id="kpiGrandTotal">0</div>
      </div>
    </section>

    <section class="sheet" id="registerSheet">
      <div class="doc-header">
        <div class="doc-title-line">
          <span>CALICUT UNIVERSITY</span>
          <input class="inline-input" id="semInput" style="width: 110px;" placeholder="FIFTH" oninput="onMetaChange()" />
          <span>SEMESTER FYUGP EXAMINATIONS</span>
          <input class="inline-input" id="monthYearInput" style="width: 150px;" placeholder="NOVEMBER 2026" oninput="onMetaChange()" />
        </div>
        <div class="doc-subtitle">UNIVERSITY PAPER ISSUE REGISTER</div>
        <div class="doc-college-wrap">
          <input class="college-input" id="collegeInput" placeholder="ENTER COLLEGE NAME & PLACE" oninput="onMetaChange()" />
        </div>
      </div>

      <div class="meta-grid">
        <div class="meta-row">
          <label for="deptInput">DEPARTMENT :</label>
          <input class="meta-input" id="deptInput" placeholder="ENTER DEPARTMENT NAME" oninput="onMetaChange()" />
        </div>
        <div class="meta-row">
          <label for="chairmanInput">NAME OF CHAIRMAN :</label>
          <input class="meta-input" id="chairmanInput" placeholder="ENTER CHAIRMAN NAME" oninput="onMetaChange()" />
        </div>
        <div class="meta-row">
          <label for="chiefInput">CHIEF EXAMINER :</label>
          <input class="meta-input" id="chiefInput" placeholder="ENTER CHIEF EXAMINER NAME" oninput="onMetaChange()" />
        </div>
      </div>

      <div id="blocksContainer"></div>

      <div class="footer-summary">
        <div class="grand-box">
          GRAND TOTAL PAPERS ISSUED : <span id="grandTotalText">0</span>
        </div>
        <div class="sign-cols">
          <div class="sign-line">CHIEF EXAMINER</div>
          <div class="sign-line">CHAIRMAN / CHIEF SUPDT.</div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "cu_fyugp_paper_issue_register_v2";

    function createEmptyRow() {
      return {
        course: "",
        qpCode: "",
        date: "",
        fnAn: "",
        regNo: "",
        count: ""
      };
    }

    function createEmptyBlock(rowCount = 4) {
      return {
        examiner: "",
        rows: Array.from({ length: rowCount }, () => createEmptyRow())
      };
    }

    function getDefaultState() {
      return {
        semester: "FIFTH",
        monthYear: "NOVEMBER 2026",
        college: "",
        department: "",
        chairman: "",
        chiefExaminer: "",
        blocks: [
          createEmptyBlock(4),
          createEmptyBlock(4),
          createEmptyBlock(4),
          createEmptyBlock(4)
        ]
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("mic_cu_fyugp_paper_issue_register_v1");
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.blocks) || parsed.blocks.length === 0) {
          return getDefaultState();
        }
        return {
          ...getDefaultState(),
          ...parsed
        };
      } catch {
        return getDefaultState();
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error("Failed to save state:", e);
      }
    }

    function showToast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function parseMultiLineCount(val) {
      if (!val) return 0;
      const matches = String(val).match(/-?\d+(\.\d+)?/g);
      if (!matches) return 0;
      return matches.reduce((sum, num) => sum + Number(num), 0);
    }

    function computeBlockTotal(block) {
      return block.rows.reduce((sum, r) => sum + parseMultiLineCount(r.count), 0);
    }

    function autoResizeTextarea(el) {
      el.style.height = "auto";
      el.style.height = Math.max(22, el.scrollHeight) + "px";
    }

    function autoResizeAllTextareas() {
      document.querySelectorAll("textarea.cell-input").forEach(autoResizeTextarea);
    }

    function onMetaChange() {
      state.semester = document.getElementById("semInput").value;
      state.monthYear = document.getElementById("monthYearInput").value;
      state.college = document.getElementById("collegeInput").value;
      state.department = document.getElementById("deptInput").value;
      state.chairman = document.getElementById("chairmanInput").value;
      state.chiefExaminer = document.getElementById("chiefInput").value;
      saveState();
    }

    function updateTotalsOnly() {
      let grandTotal = 0;
      let totalRows = 0;

      state.blocks.forEach((block, bIdx) => {
        const bTotal = computeBlockTotal(block);
        grandTotal += bTotal;
        totalRows += block.rows.length;
        const grossEl = document.getElementById(`gross-${bIdx}`);
        if (grossEl) grossEl.textContent = bTotal;
      });

      document.getElementById("grandTotalText").textContent = grandTotal;
      document.getElementById("kpiExaminers").textContent = state.blocks.length;
      document.getElementById("kpiRows").textContent = totalRows;
      document.getElementById("kpiGrandTotal").textContent = grandTotal;
    }

    function addExaminerBlock() {
      state.blocks.push(createEmptyBlock(4));
      saveState();
      render();
      showToast("Added Additional Examiner section");
    }

    function removeExaminerBlock(bIdx) {
      if (state.blocks.length <= 1) {
        showToast("At least one examiner section is required");
        return;
      }
      state.blocks.splice(bIdx, 1);
      saveState();
      render();
      showToast("Removed examiner section");
    }

    function addRow(bIdx) {
      state.blocks[bIdx].rows.push(createEmptyRow());
      saveState();
      render();
    }

    function removeRow(bIdx, rIdx) {
      if (state.blocks[bIdx].rows.length <= 1) {
        state.blocks[bIdx].rows[0] = createEmptyRow();
      } else {
        state.blocks[bIdx].rows.splice(rIdx, 1);
      }
      saveState();
      render();
    }

    function clearRegister() {
      if (!confirm("Clear all entered register data?")) return;
      state = getDefaultState();
      saveState();
      render();
      showToast("Register cleared");
    }

    function sanitizeFilenamePart(str) {
      const cleaned = (str || "")
        .trim()
        .replace(/[^a-zA-Z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");
      return cleaned || "Department";
    }

    function exportBackup() {
      const deptSlug = sanitizeFilenamePart(state.department);
      const dateStr = new Date().toISOString().slice(0, 10);
      const filename = `${deptSlug}_Paper_Issue_Register_${dateStr}.json`;

      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`Downloaded ${filename}`);
    }

    function importBackup(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed.blocks)) {
            throw new Error("Invalid backup file");
          }
          state = {
            ...getDefaultState(),
            ...parsed
          };
          saveState();
          render();
          showToast("Backup restored successfully");
        } catch {
          showToast("Invalid JSON backup file");
        }
        event.target.value = "";
      };
      reader.readAsText(file);
    }

    function handlePrint() {
      const originalTitle = document.title;
      const deptSlug = sanitizeFilenamePart(state.department);
      document.title = `${deptSlug}_Paper_Issue_Register`;
      window.print();
      setTimeout(() => {
        document.title = originalTitle;
      }, 500);
    }

    function render() {
      document.getElementById("semInput").value = state.semester || "";
      document.getElementById("monthYearInput").value = state.monthYear || "";
      document.getElementById("collegeInput").value = state.college || "";
      document.getElementById("deptInput").value = state.department || "";
      document.getElementById("chairmanInput").value = state.chairman || "";
      document.getElementById("chiefInput").value = state.chiefExaminer || "";

      const container = document.getElementById("blocksContainer");
      container.innerHTML = "";

      state.blocks.forEach((block, bIdx) => {
        const blockEl = document.createElement("div");
        blockEl.className = "examiner-block";

        const barEl = document.createElement("div");
        barEl.className = "examiner-bar";

        const leftEl = document.createElement("div");
        leftEl.className = "examiner-left";

        const labelEl = document.createElement("span");
        labelEl.textContent = "ADDITIONAL :";

        const nameInput = document.createElement("input");
        nameInput.className = "examiner-name-input";
        nameInput.placeholder = `${bIdx + 1}. ENTER ADDITIONAL EXAMINER NAME`;
        nameInput.value = block.examiner || "";
        nameInput.oninput = (e) => {
          state.blocks[bIdx].examiner = e.target.value;
          saveState();
        };

        leftEl.append(labelEl, nameInput);

        const ctrlEl = document.createElement("div");
        ctrlEl.className = "block-controls";

        const addRowBtn = document.createElement("button");
        addRowBtn.type = "button";
        addRowBtn.className = "mini-btn";
        addRowBtn.textContent = "+ Row";
        addRowBtn.onclick = () => addRow(bIdx);

        const delBlockBtn = document.createElement("button");
        delBlockBtn.type = "button";
        delBlockBtn.className = "mini-btn danger";
        delBlockBtn.textContent = "Remove";
        delBlockBtn.onclick = () => removeExaminerBlock(bIdx);

        ctrlEl.append(addRowBtn, delBlockBtn);
        barEl.append(leftEl, ctrlEl);

        const table = document.createElement("table");
        table.innerHTML = `
          <thead>
            <tr>
              <th class="col-sl">SL. NO</th>
              <th class="col-course">COURSE</th>
              <th class="col-qp">QP CODE</th>
              <th class="col-date">DATE</th>
              <th class="col-fnan">FN / AN</th>
              <th class="col-reg">REG. NO</th>
              <th class="col-count">COUNT</th>
              <th class="col-sign">SIGN</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;

        const tbody = table.querySelector("tbody");

        block.rows.forEach((row, rIdx) => {
          const tr = document.createElement("tr");

          const slTd = document.createElement("td");
          slTd.className = "col-sl";
          slTd.textContent = rIdx + 1;

          const makeTextareaTd = (field, colClass, extraClass = "", placeholder = "") => {
            const td = document.createElement("td");
            td.className = colClass;
            const ta = document.createElement("textarea");
            ta.className = `cell-input ${extraClass}`.trim();
            ta.rows = 1;
            ta.placeholder = placeholder;
            ta.value = row[field] || "";
            ta.oninput = (e) => {
              state.blocks[bIdx].rows[rIdx][field] = e.target.value;
              autoResizeTextarea(e.target);
              if (field === "count") updateTotalsOnly();
              saveState();
            };
            td.appendChild(ta);
            return td;
          };

          const courseTd = makeTextareaTd("course", "col-course", "", "Course name(s)");
          const qpTd = makeTextareaTd("qpCode", "col-qp", "center-input", "QP code(s)");
          const dateTd = makeTextareaTd("date", "col-date", "center-input", "DD-MM-YYYY");
          const fnAnTd = makeTextareaTd("fnAn", "col-fnan", "center-input", "FN/AN");
          const regTd = makeTextareaTd("regNo", "col-reg", "", "Reg. no range(s)");
          const countTd = makeTextareaTd("count", "col-count", "count-input", "0");

          const signTd = document.createElement("td");
          signTd.className = "col-sign";
          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "row-del-btn";
          delBtn.title = "Delete row";
          delBtn.textContent = "×";
          delBtn.onclick = () => removeRow(bIdx, rIdx);
          signTd.appendChild(delBtn);

          tr.append(slTd, courseTd, qpTd, dateTd, fnAnTd, regTd, countTd, signTd);
          tbody.appendChild(tr);
        });

        const grossTr = document.createElement("tr");
        grossTr.className = "gross-row";
        grossTr.innerHTML = `
          <td colspan="6" class="gross-label">GROSS TOTAL :</td>
          <td class="gross-val" id="gross-${bIdx}">${computeBlockTotal(block)}</td>
          <td></td>
        `;
        tbody.appendChild(grossTr);

        blockEl.append(barEl, table);
        container.appendChild(blockEl);
      });

      updateTotalsOnly();
      autoResizeAllTextareas();
    }

    render();
  </script>
</body>
</html>
